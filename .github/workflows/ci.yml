name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Disabled for now — focusing CI on Windows, the actual shipping target, rather than
  # also carrying Linux toolchain gaps (see #8's resolution comment for what those were).
